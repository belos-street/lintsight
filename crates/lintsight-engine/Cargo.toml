[package]
name = "lintsight-engine"
version = "0.1.0"
edition = "2021"
publish = false

# M2 深度分析引擎（design-m2 §4.1）：oxc crates =0.150.0 精确锁（对齐 oxlint 1.83.0，
# 同日发布口径见 version-policy），升级走独立评审 + 语料基线 diff 门禁
[dependencies]
oxc_allocator = "=0.150.0"
oxc_parser = "=0.150.0"
oxc_ast = "=0.150.0"
# cfg feature：启用 Semantic 内的 CFG 构建（默认关闭，T2.2/T2.3 需要）
oxc_semantic = { version = "=0.150.0", features = ["cfg"] }
oxc_cfg = "=0.150.0"
oxc_span = "=0.150.0"
oxc_syntax = "=0.150.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 文件级并行（T2.6）：每文件独立 arena，峰值 ≈ 线程数 × 最大单文件
rayon = "1"

[profile.release]
lto = "thin"
