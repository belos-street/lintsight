[package]
name = "oxc-poc"
version = "0.0.0"
edition = "2021"
publish = false

# spike ①：oxc crate 直连 PoC —— 版本对齐 oxlint 1.83.0（2026-09-14 同日发布），= 精确锁
[dependencies]
oxc_allocator = "=0.150.0"
oxc_parser = "=0.150.0"
oxc_ast = "=0.150.0"
# cfg feature：启用 Semantic 内的 CFG 构建（默认关闭，必须显式开启）
oxc_semantic = { version = "=0.150.0", features = ["cfg"] }
oxc_cfg = "=0.150.0"
oxc_span = "=0.150.0"

[profile.release]
lto = "thin"
